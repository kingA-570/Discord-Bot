spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/domistats_bot}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: INFO
    com.domistats.bot: INFO

discord:
  token: ${DISCORD_BOT_TOKEN:}
  # Guild ID for fast, per-guild slash command registration during development.
  # Leave blank to register commands globally (can take up to 1 hour to propagate).
  dev-guild-id: ${DISCORD_DEV_GUILD_ID:}

domistats:
  base-url: ${DOMISTATS_BASE_URL:https://domistats.com}
  # Minimum delay between outbound requests to DomiStats, in milliseconds.
  # Must respect DomiStats' robots.txt and terms of service - verify before deploying.
  min-request-interval-ms: ${DOMISTATS_MIN_INTERVAL_MS:2000}
  # How often the spin/war radar sweep runs.
  scan-interval-ms: ${DOMISTATS_SCAN_INTERVAL_MS:60000}
  # Cache TTL for alliance detail pages (they don't change second-to-second).
  alliance-cache-ttl-seconds: ${DOMISTATS_ALLIANCE_CACHE_TTL:60}
  spinning-cache-ttl-seconds: ${DOMISTATS_SPINNING_CACHE_TTL:30}
  user-agent: "${DOMISTATS_USER_AGENT:DomiStatsWarRadarBot/1.0 (+contact: your-email@example.com)}"
  request-timeout-ms: 10000
  max-retries: 4
  retry-base-backoff-ms: 500
